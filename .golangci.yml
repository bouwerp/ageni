run:
  timeout: 5m
  tests: true

linters:
  enable:
    - gofmt
    - govet
    - errcheck
    - staticcheck
    - unused
    - gosimple
    - ineffassign
    - typecheck
    - copyloopvar
    - gocyclo
    - misspell
    - unconvert
    - unparam
    - gosec
    - gocritic

linters-settings:
  gocyclo:
    min-complexity: 50
  gocritic:
    enabled-checks:
      - appendCombine
      - boolExprSimplify
      - dupImport
      - emptyStringTest
      - hexLiteral
      - methodExprCall
      - stringXbytes
      - typeUnparen
      - unnecessaryBlock
      - yodaStyleExpr

issues:
  exclude-dirs:
    - vendor
  exclude-rules:
    - path: _test\.go
      linters:
        - gocyclo
        - errcheck
        - gosec
    - linters:
        - unparam
      text: "is unused"
    # Tools intentionally write user-facing files with standard permissions
    # (0644/0755) and execute arbitrary shell commands — that's their job.
    - path: internal/tools/files\.go
      linters:
        - gosec
    - path: internal/tools/shell\.go
      linters:
        - gosec
        - gocritic
    - path: internal/tools/tests\.go
      linters:
        - gosec
    # Self-update fetches archives from GitHub-supplied URLs and writes a
    # 0755 executable, both of which are required for the feature.
    - path: cmd/ageni/update\.go
      linters:
        - gosec
    # 'doctor' shells out to the platform package manager — the command
    # string is built from a closed allow-list of known package managers.
    - path: cmd/ageni/doctor\.go
      linters:
        - gosec
