name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    name: Build and Release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # macOS
          - os: macos-latest
            goos: darwin
            goarch: amd64
            name: ageni-darwin-amd64
          - os: macos-latest
            goos: darwin
            goarch: arm64
            name: ageni-darwin-arm64
          # Linux
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            name: ageni-linux-amd64
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            name: ageni-linux-arm64
          # Windows
          - os: ubuntu-latest
            goos: windows
            goarch: amd64
            name: ageni-windows-amd64.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          go build -v -ldflags="-s -w -X main.version=${{ github.ref_name }} -X main.buildTime=${BUILD_TIME}" -o ${{ matrix.name }} ./cmd/ageni

      - name: Create package (Unix)
        if: matrix.goos != 'windows'
        run: |
          tar czf ${{ matrix.name }}.tar.gz ${{ matrix.name }}
          shasum -a 256 ${{ matrix.name }}.tar.gz > ${{ matrix.name }}.tar.gz.sha256

      - name: Create package (Windows)
        if: matrix.goos == 'windows'
        run: |
          zip ${{ matrix.name }}.zip ${{ matrix.name }}
          shasum -a 256 ${{ matrix.name }}.zip > ${{ matrix.name }}.zip.sha256

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ageni-*
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
